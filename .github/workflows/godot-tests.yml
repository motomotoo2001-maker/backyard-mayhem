name: Godot Tests

on:
  push:
    branches:
      - dev/backyard-vertical-slice
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Editor parse gate
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Run headless tests
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/run_all.gd
