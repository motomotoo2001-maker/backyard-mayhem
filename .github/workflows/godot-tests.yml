name: Godot Tests

on:
  push:
    branches:
      - dev/backyard-vertical-slice
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install runtime packages
        run: sudo apt-get update && sudo apt-get install -y unzip xvfb

      - name: Install art pipeline test packages
        run: python3 -m pip install --quiet pillow numpy

      - name: Run Python art pipeline tests
        run: python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Editor parse gate
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee editor.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" editor.log; then
            echo "::error::Godot editor reported a script/parse error"
            exit 1
          fi

      - name: Run headless tests
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/run_all.gd 2>&1 | tee tests.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" tests.log; then
            echo "::error::Godot tests emitted a script/parse error despite process exit code"
            exit 1
          fi

      - name: Capture backyard visual snapshots
        shell: bash
        run: |
          set -o pipefail
          rm -rf artifacts
          mkdir -p artifacts
          xvfb-run -a ./Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tests/capture_backyard_preview.gd 2>&1 | tee visual.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR:.*capture|ERROR:.*preview" visual.log; then
            echo "::error::Godot visual capture reported an error"
            exit 1
          fi
          test -s artifacts/backyard-wave1.png
          test -s artifacts/backyard-damaged-tier1.png
          test -s artifacts/backyard-boss-wave5.png

      - name: Upload backyard visual snapshots
        uses: actions/upload-artifact@v4
        with:
          name: backyard-preview
          path: artifacts/backyard-*.png
          if-no-files-found: error
