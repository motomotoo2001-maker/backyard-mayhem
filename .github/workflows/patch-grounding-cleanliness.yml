name: Patch Grounding Cleanliness Integration

on:
  push:
    branches:
      - dev/backyard-vertical-slice
    paths:
      - .github/workflows/patch-grounding-cleanliness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active development branch
        uses: actions/checkout@v5
        with:
          ref: dev/backyard-vertical-slice
          fetch-depth: 1

      - name: Fix dynamic module loading for Python 3.12 dataclasses
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/art/build_full_project_hero_candidate.py")
          text = path.read_text(encoding="utf-8")

          if "import sys\n" not in text:
              anchor = "import shutil\n"
              if anchor not in text:
                  raise SystemExit("import anchor missing")
              text = text.replace(anchor, anchor + "import sys\n", 1)

          old = '''def _load_module(path: Path, name: str):\n    spec = importlib.util.spec_from_file_location(name, path)\n    if spec is None or spec.loader is None:\n        raise RuntimeError(f"Cannot load {name} from {path}")\n    module = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(module)\n    return module\n'''
          new = '''def _load_module(path: Path, name: str):\n    spec = importlib.util.spec_from_file_location(name, path)\n    if spec is None or spec.loader is None:\n        raise RuntimeError(f"Cannot load {name} from {path}")\n    module = importlib.util.module_from_spec(spec)\n    sys.modules[name] = module\n    try:\n        spec.loader.exec_module(module)\n    except Exception:\n        sys.modules.pop(name, None)\n        raise\n    return module\n'''

          if new not in text:
              if old not in text:
                  raise SystemExit("_load_module contract changed unexpectedly")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          print("fixed dynamic module loading for dataclass-based cleanup helpers")
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/art/build_full_project_hero_candidate.py; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "Backyard Mayhem CI"
          git config user.email "actions@users.noreply.github.com"
          git add tools/art/build_full_project_hero_candidate.py
          git commit -m "fix: register dynamic art modules before execution"
          git push origin HEAD:dev/backyard-vertical-slice
